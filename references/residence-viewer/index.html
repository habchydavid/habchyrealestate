<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Residence Floor — Photoreal Viewer</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #07080b; color: #e9e4da; font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  /* low tier: vignette without a shader pass */
  body[data-tier="low"] #stage::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 48%, rgba(0,0,0,.55) 100%); }
  #hud { position: fixed; left: 16px; bottom: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
  #hud button { appearance: none; border: 1px solid rgba(233,228,218,.18); background: rgba(14,15,19,.62); color: inherit; font: inherit;
    letter-spacing: .02em; padding: 7px 12px; border-radius: 999px; cursor: pointer; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #hud button:hover { border-color: rgba(255,196,130,.6); }
  #hud button:focus-visible { outline: 2px solid #ffc482; outline-offset: 2px; }
  #hint { position: fixed; right: 16px; bottom: 22px; opacity: .45; font-size: 12px; pointer-events: none; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #07080b; transition: opacity .6s ease; }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading .track { width: min(240px, 50vw); height: 2px; background: rgba(233,228,218,.14); overflow: hidden; border-radius: 2px; }
  #bar { height: 100%; background: #ffc482; transform: scaleX(0); transform-origin: left; transition: transform .25s ease; }
  @media (max-width: 560px) { #hint { display: none; } }
  @media (prefers-reduced-motion: reduce) { #loading, #bar { transition: none; } }
</style>
</head>
<body>
<div id="stage"></div>
<div id="hud">
  <button id="btn-q" type="button" title="Cycle Auto → High → Low">Quality</button>
  <button id="btn-tone" type="button" title="Switch tone mapping">Tone</button>
</div>
<div id="hint">Drag to orbit · scroll to zoom · right-drag to pan</div>
<div id="loading"><div class="track"><div id="bar"></div></div></div>
<script type="module" src="./viewer.js"></script>
</body>
</html>
